<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر مصطفى</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px #ddd;
        }
        .item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
        .btn {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>متجر مصطفى</h1>

<div class="products">

    <!-- المنتج 1 -->
    <div class="item">
        <img src="‫(١) واتساب - Google Chrome‬ 12_06_47 04_46_28 م.png" alt="منتج 1">
        <h3>كريم مفيد للبشرة</h3>
        <p>السعر: 80 ريال</p>
        <a class="btn" href="https://wa.me/20 109 342 3141?text=ارغب فى شراءة الان">اطلبة الان</a>
    </div>

    <!-- المنتج 2 -->
    <div class="item">
        <img src="images/product2.jpg" alt="منتج 2">
        <h3>سماعات بلوتوث</h3>
        <p>السعر: 50 ريال</p>
        <a class="btn" href="https://wa.me/9665XXXXXXXX?text=أرغب%20في%20شراء%20سماعات%20بلوتوث">اطلب عبر واتساب</a>
    </div>

    <!-- المنتج 3 -->
    <div class="item">
        <img src="images/product3.jpg" alt="منتج 3">
        <h3>باور بنك</h3>
        <p>السعر: 60 ريال</p>
        <a class="btn" href="https://wa.me/9665XXXXXXXX?text=أرغب%20في%20شراء%20باور%20بنك">اطلب عبر واتساب</a>
    </div>

</div>

</body>
</html>
