<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر مصطفى</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px #ddd;
        }
        .item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
        .phone {
            margin-top: 10px;
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>متجر خالتو</h1>

<div class="products">

    <!-- المنتج 1 — جسم -->
    <div class="item">
        <img src="(١) واتساب - Google Chrome‬ 12_06_47 04_46_28 م.png" alt="جسم">
        <h3>جسم</h3>
        <p>السعر: 80 ريال</p>
        <div class="phone">رقم الطلب: 201093243141</div>
    </div>

    <!-- المنتج 2 — كريم -->
    <div class="item">
        <img src="(١) واتساب - Google Chrome‬ 12_06_47 04_48_22 م.png" alt="كريم">
        <h3>كريم</h3>
        <p>السعر: 50 ريال</p>
        <div class="phone">رقم الطلب:201093243141</div>
    </div>

    <!-- المنتج 3 — مرهم -->
    <div class="item">
        <img src="(١) واتساب - Google Chrome‬ 12_06_47 04_48_55 م.png" alt="مرهم">
        <h3>مرهم</h3>
        <p>السعر: 60 ريال</p>
        <div class="phone">رقم الطلب: 201093243141</div>
    </div>

</div>

</body>
</html>
